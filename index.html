<script>
const coins = [
  { id: 'ethereum', sym: 'ETH', top: false },
  { id: 'solana', sym: 'SOL', top: false },
  { id: 'arbitrum', sym: 'ARB', top: false },
  { id: 'matic-network', sym: 'POL', top: false }
];

let lastScoredData = [];
let currentCurrency = 'USD';
let audRate = 1.52;

function setCurrency(curr) {
  currentCurrency = curr;
  document.getElementById('btnUSD').classList.toggle('active', curr === 'USD');
  document.getElementById('btnAUD').classList.toggle('active', curr === 'AUD');
  refreshDisplay();
}

function formatPrice(value) {
  let display = value;
  if (currentCurrency === 'AUD') display = value * audRate;
  return '$' + display.toFixed(value < 1 ? 6 : 2);
}

function updateGridWindow(coinId, prefix) {
  const coinData = lastScoredData.find(c => c.id === coinId);
  if (!coinData) return;

  const currentPrice = Number(coinData.current_price);
  const low = Number(coinData.low_24h);
  const high = Number(coinData.high_24h);

  if (!currentPrice || !low || !high || high <= low) return;

  const step = (high - low) / 10;
  const gridsBelow = Math.floor((currentPrice - low) / step);
  const nextBuy = low + gridsBelow * step;
  const nextSell = low + (gridsBelow + 1) * step;
  const pos = Math.max(0, Math.min(100, ((currentPrice - low) / (high - low)) * 100));

  document.getElementById(`${prefix}Price`).innerText = formatPrice(currentPrice);
  document.getElementById(`${prefix}Range`).innerText = `${formatPrice(low)} - ${formatPrice(high)}`;
  document.getElementById(`${prefix}Step`).innerText = formatPrice(step);
  document.getElementById(`${prefix}Buy`).innerText = formatPrice(nextBuy);
  document.getElementById(`${prefix}Sell`).innerText = formatPrice(nextSell);
  document.getElementById(`${prefix}Fill`).style.width = pos + '%';
  document.getElementById(`${prefix}Marker`).style.left = pos + '%';
}

function refreshDisplay() {
  if (!lastScoredData.length) return;

  let tickerHtml = `<div class="ticker-item">SEA CHEF LABS LIVE FEED (${currentCurrency}):</div>`;

  lastScoredData.forEach(c => {
    const change = c.price_change_percentage_24h || 0;
    const color = change >= 0 ? 'green' : 'red';
    const arrow = change >= 0 ? '▲' : '▼';

    tickerHtml += `
      <div class="ticker-item">
        <strong>${c.symbol.toUpperCase()}</strong>: ${formatPrice(c.current_price)}
        <span class="${color}">(${arrow} ${change.toFixed(2)}%)</span>
      </div>
    `;
  });

  document.getElementById('newsTickerTrack').innerHTML = tickerHtml + tickerHtml;
  document.getElementById('coinCount').innerText = lastScoredData.length;
}

async function loadData() {
  try {
    const ids = coins.map(c => c.id).join(',');
    const res = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${encodeURIComponent(ids)}`);

    if (!res.ok) throw new Error(`CoinGecko failed: ${res.status}`);

    const data = await res.json();

    lastScoredData = data.filter(Boolean);

    updateGridWindow('solana', 'sol');
    updateGridWindow('ethereum', 'eth');
    updateGridWindow('arbitrum', 'arb');
    updateGridWindow('matic-network', 'pol');

    refreshDisplay();

  } catch (e) {
    console.error(e);
    document.getElementById('topPicks').innerHTML = '<div class="card">Market data unavailable</div>';
    document.getElementById('queuePicks').innerHTML = '<div class="card">Try again in a minute</div>';
  }
}

loadData();
setInterval(loadData, 60000);
</script>
