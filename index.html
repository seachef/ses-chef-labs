<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea Chef Labs</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        h1 { color: #00ff88; }
        .btn { background: #00d9ff; color: black; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .coin { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #00ff88; }
        .dip { color: #fbbf24; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🌊 Sea Chef Labs - Live Dashboard</h1>
    
    <div class="grid">
        <div class="card">
            <h3>Total Portfolio</h3>
            <h2 id="totalVal">$0.00</h2>
            <button class="btn" onclick="connectWallet()">Connect Wallet</button>
        </div>
        <div class="card">
            <h3>24h P/L</h3>
            <h2 id="plVal">$0.00</h2>
        </div>
    </div>

    <h2> Top AI Picks & Dip Targets</h2>
    <div class="grid" id="coinGrid">
        <div class="card">Loading live data...</div>
    </div>

    <script>
        const coins = [
            { id: 'pepe', symbol: 'PEPE' },
            { id: 'bitcoin', symbol: 'BTC' },
            { id: 'ethereum', symbol: 'ETH' },
            { id: 'solana', symbol: 'SOL' },
            { id: 'dogwifcoin', symbol: 'WIF' },
            { id: 'render-token', symbol: 'RNDR' }
        ];

        async function loadData() {
            try {
                const ids = coins.map(c => c.id).join(',');
                const res = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}`);
                const data = await res.json();
                
                let html = '';
                data.forEach(coin => {
                    const dip = (coin.low_24h * 1.02).toFixed(coin.current_price < 1 ? 6 : 2);
                    html += `
                    <div class="coin">
                        <h3>${coin.symbol} <span style="color:#00ff88; font-size:0.8em">${coin.price_change_percentage_24h.toFixed(1)}%</span></h3>
                        <p>Price: $${coin.current_price}</p>
                        <p class="dip"> Dip Target: $${dip}</p>
                        <a href="https://dexscreener.com/search?q=${coin.symbol}" target="_blank" style="color:#00d9ff">Check DexScreener</a>
                    </div>`;
                });
                document.getElementById('coinGrid').innerHTML = html;
            } catch (e) {
                document.getElementById('coinGrid').innerHTML = '<div class="card">Error loading data. Retrying...</div>';
            }
        }

        function connectWallet() {
            alert("This is where Phantom/Rabby would connect!");
        }

        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
.
