<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sea Chef Labs</title>
<style>
body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; margin: 0; }
.header { display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 20px; }
h1 { color: #00ff88; margin: 0; }
.btn { background: #00d9ff; color: black; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-left: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
.card { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
.card h3 { color: #94a3b8; margin-top: 0; font-size: 14px; }
.card h2 { margin: 10px 0; font-size: 24px; }
.green { color: #00ff88; }
.coin { background: #1e293b; padding: 15px; border-radius: 8px; border-left: 4px solid #00ff88; }
.coin-head { display: flex; justify-content: space-between; margin-bottom: 10px; }
.coin-name { font-weight: bold; color: #00d9ff; }
.dip { color: #fbbf24; font-weight: bold; margin: 10px 0; font-size: 14px; }
.buy { display: block; background: #00ff88; color: black; text-align: center; padding: 8px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 10px; }
</style>
</head>
<body>

<div class="header">
  <h1>🌊 Sea Chef Labs</h1>
  <div>
    <button class="btn">Connect Rabby</button>
    <button class="btn" style="background:#ab9ff2">Connect Phantom</button>
  </div>
</div>

<div class="grid">
  <div class="card"><h3>Total Portfolio</h3><h2>$0.00</h2><div class="green">Connect wallet</div></div>
  <div class="card"><h3>24h P/L</h3><h2 class="green">$0.00</h2><div style="color:#94a3b8">Live scan</div></div>
  <div class="card"><h3>Active Research</h3><h2 id="count">0</h2><div style="color:#94a3b8">Coins scanning</div></div>
</div>

<h2>🔥 AI Top Picks & Dip Targets</h2>
<div class="grid" id="coins">
  <div class="card">Connecting to live data...</div>
</div>

<script>
const list = [
  {id:'pepe', sym:'PEPE'}, {id:'bitcoin', sym:'BTC'}, {id:'ethereum', sym:'ETH'}, 
  {id:'solana', sym:'SOL'}, {id:'dogwifcoin', sym:'WIF'}, {id:'render-token', sym:'RNDR'}
];

async function load() {
  try {
    const ids = list.map(c=>c.id).join(',');
    const res = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${ids}`);
    const data = await res.json();
    let html = '';
    data.forEach(c => {
      const dip = (c.low_24h * 1.02).toFixed(c.current_price < 1 ? 6 : 2);
      html += `<div class="coin">
        <div class="coin-head"><span class="coin-name">${c.sym}</span><span class="green">${c.price_change_percentage_24h.toFixed(1)}%</span></div>
        <div>Price: $${c.current_price}</div>
        <div class="dip">🎯 Dip Target: $${dip}</div>
        <a href="https://dexscreener.com/search?q=${c.sym}" target="_blank" style="color:#00d9ff; font-size:12px">Check DexScreener</a>
        <a href="#" class="buy">Buy on Exchange</a>
      </div>`;
    });
    document.getElementById('coins').innerHTML = html;
    document.getElementById('count').innerText = data.length;
  } catch(e) {
    document.getElementById('coins').innerHTML = '<div class="card">Error loading data. Retrying...</div>';
  }
}
load();
setInterval(load, 60000);
</script>

</body>
</html>
