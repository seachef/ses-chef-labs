<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d15">
<title>NEPTUNE 2.0</title>
<style>
:root{color-scheme:dark;font:14px system-ui,-apple-system,Segoe UI,sans-serif;background:#080d15;color:#edf3fa}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:18px clamp(16px,4vw,48px);border-bottom:1px solid #253344}h1{font-size:17px;letter-spacing:.18em;margin:0}small,.muted{color:#8ea0b5}main{max-width:1500px;margin:auto;padding:24px clamp(16px,4vw,48px)}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:18px}input{background:#111d2a;border:1px solid #34465a;color:inherit;border-radius:8px;padding:12px;min-width:200px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th{text-align:left;color:#8ea0b5;font-weight:500;font-size:12px}td,th{padding:14px 10px;border-bottom:1px solid #1e2c3b}td:nth-child(n+3),th:nth-child(n+3){text-align:right}.symbol{font-weight:700}.up{color:#59d9a6}.down{color:#ff8295}.status{font-size:12px}button{cursor:pointer;background:#1c2c3b;color:inherit;border:1px solid #34465a;border-radius:8px;padding:10px 12px}button:hover{background:#294158}.scroll{overflow-x:auto}footer{margin-top:20px;color:#8193a6;font-size:12px}@media(max-width:600px){main{padding:16px}td,th{padding:12px 7px;font-size:12px}.hide-sm{display:none}}
</style>
<header><h1>NEPTUNE <small>2.0</small></h1><span class="status" id="status" role="status">Connecting…</span></header>
<main><div class="top"><div><strong>Crypto markets</strong><div class="muted">USD · Market snapshot · Read only</div></div><div><input id="filter" aria-label="Search assets" placeholder="Search coin or symbol"><button id="refresh">Refresh</button></div></div><div class="scroll"><table><thead><tr><th>Asset</th><th>Symbol</th><th>Price</th><th>24h</th><th class="hide-sm">Market cap</th><th class="hide-sm">Volume 24h</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading market data…</td></tr></tbody></table></div><footer id="foot">No wallets. No trading. No simulated prices.</footer></main>
<script type="module">
const $=id=>document.getElementById(id), rows=$('rows'),status=$('status'),filter=$('filter');let coins=[],loading=false;const fmt=(v,d=2)=>Number.isFinite(v)?new Intl.NumberFormat('en-US',{maximumFractionDigits:d}).format(v):'—';const money=v=>Number.isFinite(v)?'$'+fmt(v,v<1?8:2):'—';const compact=v=>Number.isFinite(v)?'$'+new Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:2}).format(v):'—';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=filter.value.trim().toLowerCase(),found=coins.filter(x=>(x.name+' '+x.symbol).toLowerCase().includes(q));rows.innerHTML=found.length?found.map(x=>'<tr><td>'+esc(x.name)+'</td><td class="symbol">'+esc(x.symbol).toUpperCase()+'</td><td>'+money(x.current_price)+'</td><td class="'+(x.price_change_percentage_24h>=0?'up':'down')+'">'+(Number.isFinite(x.price_change_percentage_24h)?fmt(x.price_change_percentage_24h)+'%':'—')+'</td><td class="hide-sm">'+compact(x.market_cap)+'</td><td class="hide-sm">'+compact(x.total_volume)+'</td></tr>').join(''):'<tr><td colspan="6">No matching assets</td></tr>'}async function load(){if(loading)return;loading=true;status.textContent='Loading…';try{const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),9000);let response;try{response=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=100&page=1&sparkline=false',{signal:controller.signal,headers:{accept:'application/json'}})}finally{clearTimeout(timeout)}if(!response.ok)throw Error('Market feed unavailable ('+response.status+')');const data=await response.json();if(!Array.isArray(data))throw Error('Invalid market feed');coins=data;render();status.textContent='Live snapshot · '+new Date().toLocaleTimeString();$('foot').textContent='Top 100 assets by market cap · CoinGecko public API · Manual refresh · Not trading advice'}catch(e){status.textContent='Data unavailable';if(!coins.length)rows.innerHTML='<tr><td colspan="6">Market data unavailable. Try Refresh.</td></tr>';$('foot').textContent=String(e.message||'Connection failed')+' · No prices invented'}finally{loading=false}}filter.addEventListener('input',render);$('refresh').addEventListener('click',load);load();
</script></html>
