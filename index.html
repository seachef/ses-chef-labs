<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sea Chef Labs</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{margin:0;padding:15px;background:#0f172a;color:#fff}.container{max-width:1200px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #334155;padding-bottom:15px;margin-bottom:15px}h1{color:#00ff88;font-size:1.6rem}.actions,.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer;background:#00d9ff;color:#0f172a}.btn-purple{background:#ab9ff2;color:#fff}.btn-alert{background:#ff4757;color:#fff}.btn-alert.on{background:#00ff88;color:#0f172a}.wallet{border:1px solid #334155;border-radius:20px;padding:9px 12px;color:#cbd5e1;font-size:12px}.ticker{overflow:hidden;background:#020617;border-block:2px solid #00ff88;padding:10px 0;margin-bottom:20px}.track{display:flex;width:max-content;animation:scroll 40s linear infinite}.ticker-item{padding:0 30px;white-space:nowrap;color:#e2e8f0}.ticker-item strong{color:#00d9ff}@keyframes scroll{to{transform:translateX(-50%)}}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}.card,.window{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:15px}.card h3,.label{color:#94a3b8;font-size:12px}.card h2{margin:5px 0;font-size:22px}.green{color:#00ff88}.red{color:#ff4757}.title{font-size:1.1rem;margin:12px 0}.coins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}.coin{border-left:3px solid #00ff88;padding:12px;background:#1e293b;border-radius:8px}.coin b{color:#00d9ff}.window{margin-bottom:20px}.window-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:15px}.window-head strong{font-size:18px}.fee{font-size:12px;color:#94a3b8}.values{display:flex;justify-content:space-around;text-align:center;margin-bottom:15px}.values strong{display:block;font-size:15px;margin-top:4px}.zones{display:flex;height:58px;position:relative;overflow:hidden;border-radius:8px;margin-bottom:10px}.zone{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}.buy{background:rgba(255,71,87,.16);color:#ff4757;border-right:1px solid #475569}.sell{background:rgba(0,255,136,.16);color:#00ff88}.active-buy{animation:redpulse .8s infinite alternate;color:#fff}.active-sell{animation:greenpulse .8s infinite alternate;color:#0f172a}@keyframes redpulse{to{background:rgba(255,71,87,.65)}}@keyframes greenpulse{to{background:rgba(0,255,136,.65)}}.marker{position:absolute;top:0;bottom:0;width:3px;z-index:4;transition:left .4s}.live-marker{background:#fff;box-shadow:0 0 10px #fff}.entry-marker{background:#00d9ff;box-shadow:0 0 10px #00d9ff;z-index:5}.marker-label{position:absolute;top:3px;transform:translateX(-50%);font-size:10px;font-weight:700;z-index:6;white-space:nowrap}.live-label{color:#fff}.entry-label{color:#00d9ff}.legend{display:flex;justify-content:center;gap:16px;color:#cbd5e1;font-size:11px;margin:6px 0 12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.dot-live{background:#fff}.dot-entry{background:#00d9ff}.execute{display:block;text-align:center;text-decoration:none;background:linear-gradient(90deg,#00d9ff,#00ff88);color:#0f172a;padding:12px;border-radius:8px;font-weight:700}.controls{margin-bottom:12px}.controls .btn{font-size:12px;padding:8px 10px}@media(max-width:700px){.stats{grid-template-columns:1fr}.values{gap:8px}.values .label{font-size:10px}}
</style>
</head>
<body><div class="container">
<header><h1>Sea Chef Labs</h1><div class="actions"><span class="wallet" id="wallet">Wallet: Not connected</span><button class="btn" onclick="connectRabby()">Rabby</button><button class="btn btn-purple" onclick="connectPhantom()">Phantom</button><button class="btn btn-alert" id="alertBtn" onclick="enableAlerts()">🔔 Enable Alerts</button></div></header>
<div class="ticker"><div class="track" id="ticker">Loading live prices...</div></div>
<div class="stats"><div class="card" style="border:2px solid #00ff88"><h3>Portfolio</h3><h2 class="green">$0.00</h2></div><div class="card" style="border-color:#ff6b35"><h3>Full Value</h3><h2 style="color:#ff6b35">DeBank</h2></div></div>
<h2 class="title">🎯 Top 6 AI Researched Coins</h2><div class="coins" id="coins"><div class="card">Loading...</div></div>
<h2 class="title">🚨 In & Out Command Center (Live Price + Fixed Buy Entry)</h2><div id="windows"></div>
</div>
<script>
const ALERT_PCT=.05;
const assets=[
{id:'solana',sym:'SOL',name:'SOL/USDC (Solana)',fee:'~$0.0002',swap:'https://jup.ag/swap/SOL-USDC'},
{id:'dogwifcoin',sym:'WIF',name:'WIF/USDC (Solana)',fee:'~$0.0002',swap:'https://jup.ag/swap/SOL-EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm'},
{id:'jupiter-exchange-solana',sym:'JUP',name:'JUP/USDC (Solana)',fee:'~$0.0002',swap:'https://jup.ag/swap/SOL-JUPyiwrYJFskUPiHa7hkeR8VUtAeFoSYbKedZNsDvCN'},
{id:'matic-network',sym:'POL',name:'POL/USDC (Polygon)',fee:'~$0.01',swap:'https://app.uniswap.org/#/swap?outputCurrency=0x7D1AfA7B718fb893dB30A3aBc0Cfc608AaCfeBB0&chain=polygon'}];
const ids=[...assets.map(a=>a.id),'pepe','arbitrum','render-token','fetch-ai','chainlink','uniswap'];
let market=[],entries=JSON.parse(localStorage.getItem('seaChefEntries')||'{}'),alertState={};
const $=id=>document.getElementById(id),money=p=>'$'+(p<1?p.toFixed(4):p.toFixed(2));
function build(){
 $('windows').innerHTML=assets.map(a=>`<section class="window"><div class="window-head"><strong>${a.name}</strong><span class="fee">Fee: ${a.fee}</span></div><div class="values"><div><span class="label">LIVE CURRENT</span><strong id="${a.sym}-current">$0.00</strong></div><div><span class="label">FIXED BUY ENTRY</span><strong id="${a.sym}-buy" class="red">Not set</strong></div><div><span class="label">5% SELL TARGET</span><strong id="${a.sym}-sell" class="green">Not set</strong></div></div><div class="zones"><div class="zone buy" id="${a.sym}-buyzone">BUY BELOW ENTRY</div><div class="zone sell" id="${a.sym}-sellzone">HOLD / SELL ZONE</div><div class="marker entry-marker" id="${a.sym}-entry-marker" style="left:50%"></div><div class="marker-label entry-label" id="${a.sym}-entry-label" style="left:50%">BUY</div><div class="marker live-marker" id="${a.sym}-live-marker" style="left:50%"></div><div class="marker-label live-label" id="${a.sym}-live-label" style="left:50%">LIVE</div></div><div class="legend"><span><i class="dot dot-entry"></i>Fixed buy entry</span><span><i class="dot dot-live"></i>Live price</span></div><div class="controls"><button class="btn" onclick="setBuy('${a.id}')">Set Buy Price</button><button class="btn btn-purple" onclick="setNow('${a.id}')">Set Now</button><button class="btn btn-alert" onclick="clearBuy('${a.id}')">Clear</button></div><a class="execute" href="${a.swap}" target="_blank" rel="noreferrer">Execute Swap</a></section>`).join('');
}
function coin(id){return market.find(c=>c.id===id)}
function setBuy(id){const c=coin(id);const v=prompt(`Enter fixed buy price for ${c?.symbol||id}:`,entries[id]||c?.current_price||'');if(v!==null&&Number(v)>0){entries[id]=Number(v);save();render()}}
function setNow(id){const c=coin(id);if(c){entries[id]=Number(c.current_price);save();render()}}
function clearBuy(id){delete entries[id];save();render()}
function save(){localStorage.setItem('seaChefEntries',JSON.stringify(entries))}
function notify(id,sym,entry,current,target){if(current<target){delete alertState[id];return}if(!alertState[id]&&Notification.permission==='granted'){alertState[id]=true;new Notification(`${sym} reached 5% target`,{body:`Entry ${money(entry)} | Live ${money(current)} | Target ${money(target)}`})}}
function render(){assets.forEach(a=>{const c=coin(a.id);if(!c)return;const current=Number(c.current_price)||0,entry=Number(entries[a.id]);$(a.sym+'-current').textContent=money(current);$(a.sym+'-buy').textContent=entry>0?money(entry):'Not set';$(a.sym+'-sell').textContent=entry>0?money(entry*1.05):'Not set';const bz=$(a.sym+'-buyzone'),sz=$(a.sym+'-sellzone'),em=$(a.sym+'-entry-marker'),el=$(a.sym+'-entry-label'),lm=$(a.sym+'-live-marker'),ll=$(a.sym+'-live-label');bz.classList.remove('active-buy');sz.classList.remove('active-sell');if(!(entry>0)){em.style.left='50%';el.style.left='50%';lm.style.left='50%';ll.style.left='50%';bz.textContent='SET BUY ENTRY';sz.textContent='LIVE PRICE';return}const target=entry*1.05;em.style.left='50%';el.style.left='50%';let livePct=current<=entry?Math.max(0,(current/entry)*50):Math.min(100,50+((current-entry)/(target-entry))*50);lm.style.left=livePct+'%';ll.style.left=livePct+'%';if(current<entry){bz.classList.add('active-buy');bz.textContent='BUY BELOW ENTRY';sz.textContent='WAIT / WATCH'}else if(current>=target){sz.classList.add('active-sell');sz.textContent='🚨 5% SELL ALERT';bz.textContent='BUY ZONE';notify(a.id,a.sym,entry,current,target)}else{bz.textContent='BUY ZONE';sz.textContent='HOLD / WATCH';delete alertState[a.id]}})}
async function load(){try{const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids='+ids.join(','));const d=await r.json();if(!Array.isArray(d))throw Error('Market data unavailable');market=d;let h='';d.slice(0,6).forEach(c=>h+=`<div class="coin"><b>${c.symbol.toUpperCase()}</b><div>${money(c.current_price)}</div><span class="${c.price_change_percentage_24h>=0?'green':'red'}">${(c.price_change_percentage_24h||0).toFixed(2)}% (24h)</span></div>`);$('coins').innerHTML=h;let t=d.map(c=>`<span class="ticker-item"><strong>${c.symbol.toUpperCase()}</strong>: ${money(c.current_price)}</span>`).join('');$('ticker').innerHTML=t+t;render()}catch(e){console.error(e);$('coins').innerHTML='<div class="card">Live market feed unavailable.</div>'}}
async function connectRabby(){if(!window.ethereum)return alert('Rabby not detected');try{const a=await window.ethereum.request({method:'eth_requestAccounts'});$('wallet').textContent='Wallet: '+a[0].slice(0,6)+'...'+a[0].slice(-4)}catch(e){alert('Unable to connect to Rabby')}}
async function connectPhantom(){if(!window.solana)return alert('Phantom not detected');try{const a=await window.solana.connect(),s=a.publicKey.toString();$('wallet').textContent='Wallet: '+s.slice(0,6)+'...'+s.slice(-4)}catch(e){alert('Unable to connect to Phantom')}}
function enableAlerts(){if(!('Notification'in window))return alert('Notifications are not supported');Notification.requestPermission().then(p=>{if(p==='granted'){$('alertBtn').textContent='🔔 Alerts ON';$('alertBtn').classList.add('on')}})}
build();load();setInterval(load,30000);
</script></body></html>
