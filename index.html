<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sea Chef Labs</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { background: #0f172a; color: #fff; padding: 24px; }
      .container { max-width: 1000px; margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 24px; }
      h1 { color: #00ff88; font-size: 2rem; }
      .wallet-box { background: rgba(30, 41, 59, 0.9); border: 1px solid #334155; border-radius: 16px; padding: 20px; }
      .button-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
      button { appearance: none; border: none; border-radius: 10px; padding: 12px 18px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: transform 0.15s ease, opacity 0.15s ease; }
      button:hover { transform: translateY(-1px); }
      .rabby { background: #00d9ff; color: #0f172a; }
      .status { margin-top: 18px; font-size: 14px; color: #cbd5e1; line-height: 1.6; }
      .status strong { color: #fff; }
      .address { color: #00ff88; word-break: break-all; font-weight: 700; }
      .warning { margin-top: 14px; padding: 12px 14px; border: 1px solid rgba(251, 191, 36, 0.5); border-radius: 10px; background: rgba(251, 191, 36, 0.08); color: #fcd34d; font-size: 13px; }
      .small-muted { color: #94a3b8; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="container">
      <header><h1>Sea Chef Labs</h1></header>

      <div class="wallet-box">
        <h2 style="margin-bottom: 8px;">Desktop Wallet</h2>
        <p class="small-muted">For Windows and Mac, unlock Rabby in your browser and connect.</p>

        <div class="button-row">
          <button class="rabby" id="connectRabbyBtn">Connect Rabby</button>
        </div>

        <div class="status" id="walletStatus">
          <strong>Status:</strong> Not connected
        </div>

        <div class="warning">
          This only reads your public wallet address. Never enter a wallet password, private key, or recovery phrase on this website.
        </div>
      </div>
    </div>

    <script>
      const walletStatus = document.getElementById('walletStatus');

      function setStatus(message) {
        walletStatus.innerHTML = message;
      }

      function getRabbyProvider() {
        const providers = window.ethereum?.providers || [];
        return window.ethereum?.isRabby
          ? window.ethereum
          : providers.find((provider) => provider.isRabby) || null;
      }

      async function connectRabby() {
        const provider = getRabbyProvider();

        if (!provider) {
          setStatus('<strong>Status:</strong> Rabby was not found. Install the Rabby browser extension, unlock it, then refresh this page.');
          return;
        }

        try {
          setStatus('<strong>Status:</strong> Waiting for Rabby approval...');
          const accounts = await provider.request({ method: 'eth_requestAccounts' });
          const address = accounts?.[0];

          if (!address) {
            setStatus('<strong>Status:</strong> Rabby did not return an address.');
            return;
          }

          setStatus(`<strong>Status:</strong> Rabby connected<br><span class="address">${address}</span>`);
        } catch (error) {
          console.error('Rabby connection error:', error);

          if (error?.code === 4001) {
            setStatus('<strong>Status:</strong> You cancelled the Rabby connection.');
          } else {
            setStatus('<strong>Status:</strong> Rabby connection failed. Please try again.');
          }
        }
      }

      document.getElementById('connectRabbyBtn').addEventListener('click', connectRabby);

      if (window.ethereum) {
        window.ethereum.on?.('accountsChanged', (accounts) => {
          const address = accounts?.[0];
          setStatus(address
            ? `<strong>Status:</strong> Rabby connected<br><span class="address">${address}</span>`
            : '<strong>Status:</strong> Rabby disconnected.');
        });
      }
    </script>
  </body>
</html>
