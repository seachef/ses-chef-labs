const BLUECHIPS = ['BTC', 'ETH', 'SOL', 'BNB', 'XRP', 'ADA', 'AVAX', 'DOT', 'POL', 'LTC'];

const AUD_USD = 0.654;
const USD_AUD = 1.529;

const formatNum = (n, d = 2) => n.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const formatVol = (n) => n >= 1e9 ? `$${(n / 1e9).toFixed(1)}B` : `$${(n / 1e6).toFixed(0)}M`;
const timeNow = () => new Date().toLocaleTimeString('en-US', { hour12: false });

function App() {
  const [coins, setCoins] = useState(COINS);
  const [currency, setCurrency] = useState('AUD');
  const [holdings, setHoldings] = useState([]);
  const [logs, setLogs] = useState([
    { time: timeNow(), msg: 'Sea Chef Labs initialized', type: 'system' },
    { time: timeNow(), msg: '68 tokens loaded • 61 sources online', type: 'data' },
  ]);
  const [toast, setToast] = useState('');
  const [showFees, setShowFees] = useState(null);
  const [watchWallets, setWatchWallets] = useState([]);
  const [activeTab, setActiveTab] = useState('sources');

  const convertPrice = (usd) => currency === 'AUD' ? usd * USD_AUD : usd;
  const sym = currency === 'AUD' ? 'A$' : 'US$';

  // Live price updates
  useEffect(() => {
    const interval = setInterval(() => {
      setCoins(prev => prev.map(c => ({
        ...c,
        price: c.price * (1 + (Math.random() - 0.5) * 0.003),
        change1h: c.change1h + (Math.random() - 0.5) * 0.05,
        score: Math.max(20, Math.min(99, c.score + (Math.random() - 0.5) * 0.5)),
      })));
    }, 2500);
    return () => clearInterval(interval);
  }, []);

  // Research progress
  useEffect(() => {
    const interval = setInterval(() => {
      setCoins(prev => prev.map(c => c.researching ? { ...c, researchProgress: Math.min(100, c.researchProgress + Math.random() * 2) } : c));
    }, 1000);
    return () => clearInterval(interval);
  }, []);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 2500); };
  const addLog = (msg, type = 'system') => setLogs(prev => [...prev.slice(-20), { time: timeNow(), msg, type }]);

  const top3 = coins.filter(c => !c.researching && !BLUECHIPS.includes(c.symbol)).sort((a, b) => b.score - a.score).slice(0, 3);
  const bluechipCoins = coins.filter(c => BLUECHIPS.includes(c.symbol));
  const researchingCount = coins.filter(c => c.researching).length;
  const bottomCoins = coins.filter(c => !top3.includes(c) && !bluechipCoins.includes(c));

  const handleBuy = (coin) => {
    const qty = 25 / coin.price;
    setHoldings(prev => {
      const existing = prev.find(h => h.symbol === coin.symbol);
      if (existing) return prev.map(h => h.symbol === coin.symbol ? { ...h, qty: h.qty + qty, avg: (h.avg * h.qty + coin.price * qty) / (h.qty + qty) } : h);
      return [...prev, { symbol: coin.symbol, qty, avg: coin.price }];
    });
    addLog(`BUY ${coin.symbol} @ $${coin.price.toFixed(2)}`, 'trade');
    showToast(`Bought ${coin.symbol}! 🚀`);
  };

  const handleSell = (coin) => {
    const holding = holdings.find(h => h.symbol === coin.symbol);
    if (!holding) return;
    const pnl = ((coin.price - holding.avg) / holding.avg) * 100;
    setHoldings(prev => prev.filter(h => h.symbol !== coin.symbol));
    addLog(`SELL ${coin.symbol} (${pnl >= 0 ? '+' : ''}${pnl.toFixed(1)}% P&L)`, 'trade');
    showToast(`Sold ${coin.symbol}! ${pnl >= 0 ? '📈' : '📉'}`);
  };

  const portfolioValue = holdings.reduce((sum, h) => { const c = coins.find(x => x.symbol === h.symbol); return sum + (c ? c.price * h.qty : 0); }, 0);

  const FeePanel = ({ coin }) => {
    const tradingFee = 100 * 0.003;
    const networkFee = 5.50;
    const total = tradingFee + networkFee;
    return (
      <div className="mt-3 pt-3 border-t border-white/5 space-y-2">
        <div className="text-xs font-semibold text-gray-300 mb-2">💰 Fee Breakdown (A$100 trade)</div>

                { name: 'Trojan', icon: '🐴', chains: 'Solana only', speed: '5ms', fee: '0.9%' },
                { name: 'OpenLiquid', icon: '💧', chains: 'ETH, SOL, BASE', speed: '6ms', fee: '0.8%' },
              ].map((bot, i) => (
                <div key={i} className="p-3 rounded-2xl bg-white/[0.02] border border-white/5 hover:border-cyan-500/30 transition-all">
                  <div className="flex items-center gap-2 mb-2">
                    <span className="text-lg">{bot.icon}</span>
                    <span className="text-xs font-semibold text-white">{bot.name}</span>
                  </div>
                  <div className="space-y-1 text-[10px]">
                    <div className="text-gray-500">Chains: <span className="text-gray-300">{bot.chains}</span></div>
                    <div className="text-gray-500">Speed: <span className="text-emerald-400">{bot.speed}</span></div>
                    <div className="text-gray-500">Fee: <span className="text-amber-400">{bot.fee}</span></div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Bottom Research Ticker */}
        <div className="mb-6">
          <div className="flex items-center justify-between mb-3 px-2">
            <div className="flex items-center gap-2">
              <span className="text-sm">🔬</span>
              <h3 className="text-sm font-semibold text-gray-300">Research Queue</h3>
              <div className="flex items-center gap-1 px-2 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/20">
                <div className="w-1.5 h-1.5 rounded-full bg-amber-400" style={{ animation: 'pulse 2s infinite' }} />
                <span className="text-[10px] text-amber-400 font-mono">{researchingCount} ACTIVE</span>
              </div>
            </div>
            <span className="text-xs text-gray-500">{bottomCoins.length} tokens</span>
          </div>
          <div className="overflow-x-auto pb-2">
            <div className="flex gap-3 min-w-max">
              {bottomCoins.map(coin => (
                <div key={coin.symbol} className={`flex-shrink-0 w-48 rounded-2xl border p-3 transition-all ${coin.researching ? 'bg-amber-500/[0.03] border-amber-500/20' : 'bg-white/[0.02] border-white/[0.06] hover:border-violet-500/30'}`}>
                  <div className="flex items-center gap-2 mb-2">
                    <span className="text-lg">{coin.icon}</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-xs font-semibold text-white truncate">{coin.symbol}</div>
                      <div className="text-[10px] text-gray-500 truncate">{coin.name}</div>
                    </div>
                    {coin.researching && <div className="w-2 h-2 rounded-full bg-amber-400" style={{ animation: 'pulse 2s infinite' }} />}
                  </div>
                  <div className="flex justify-between mb-2">
                    <span className="text-xs font-mono text-white">{sym}{formatNum(convertPrice(coin.price))}</span>
                    <span className={`text-[10px] font-mono ${coin.change24h >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{coin.change24h >= 0 ? '+' : ''}{coin.change24h.toFixed(1)}%</span>
                  </div>
                  {coin.researching ? (
                    <div className="mb-2">
                      <div className="flex justify-between mb-1">
                        <span className="text-[10px] text-amber-400">Researching...</span>
                        <span className="text-[10px] font-mono text-amber-300">{coin.researchProgress.toFixed(0)}%</span>
                      </div>
                      <div className="w-full h-1 rounded-full bg-white/5 overflow-hidden">
                        <div className="h-full rounded-full bg-gradient-to-r from-amber-500 to-orange-500" style={{ width: `${coin.researchProgress}%` }} />
                      </div>
                    </div>
                  ) : (
                    <div className="mb-2">
                      <div className="w-full h-1 rounded-full bg-white/5 overflow-hidden">
                        <div className="h-full rounded-full bg-gradient-to-r from-violet-500 via-cyan-400 to-emerald-400" style={{ width: `${coin.score}%` }} />
                      </div>
                    </div>
                  )}
                  <button onClick={() => handleBuy(coin)} className={`w-full rounded-xl text-xs font-semibold py-1.5 transition-all active:scale-95 ${coin.researching ? 'bg-amber-500/10 border border-amber-500/30 text-amber-400' : 'bg-gradient-to-r from-violet-600 to-indigo-600 text-white hover:shadow-lg hover:shadow-violet-500/20'}`}>
                    {coin.researching ? 'WATCH' : 'BUY'}
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Activity Log */}
        <div className="glass p-6 mb-6">
          <h3 className="font-semibold text-white mb-4">📋 Activity Log</h3>
          <div className="space-y-1.5 max-h-48 overflow-y-auto">
            {logs.map((log, i) => (
              <div key={i} className="flex gap-2 py-1 px-3 rounded-xl hover:bg-white/[0.02]">
                <span className="text-[10px] text-gray-600 font-mono">{log.time}</span>
                <span className={`text-xs ${log.type === 'ai' ? 'text-emerald-400/80' : log.type === 'trade' ? 'text-cyan-400/80' : log.type === 'data' ? 'text-amber-400/80' : 'text-gray-500'}`}>{log.msg}</span>
              </div>
            ))}
          </div>
        </div>

        <footer className="text-center py-6 border-t border-white/[0.04]">
          <p className="text-xs text-gray-600 font-mono">Sea Chef Labs • 68 Tokens • 61 Sources • 26 Chains • 👁️ Watch Wallets</p>
          <p className="text-[10px] text-gray-700 mt-1">💎 10 Bluechips • 🦄 Uniswap V4 • 🍌 Banana Gun • 🐋 Whale Alerts • 🤖 AI Agents • 🛡️ MEV Protected</p>
          <p className="text-[10px] text-gray-700 mt-1">⚠️ Demo mode — connect a real wallet for live trading</p>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
