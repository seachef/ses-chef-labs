name: Bacon public feed
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bacon-public-feed
  cancel-in-progress: false
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public feed parser
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test paper shortlist
        run: |
          node --test scripts/bacon-shortlist.test.cjs scripts/retired-dashboard.test.cjs
          node scripts/validate-bacon-shortlist.cjs
      - name: Check Bacon public channels
        run: python scripts/bacon-feed.py
      - name: Save sourced feed
        run: |
          if ! git diff --quiet -- data/bacon-intelligence.json data/bacon-history.json; then
            git config user.name 'Sea Chef Bacon feed'
            git config user.email 'actions@users.noreply.github.com'
            git add data/bacon-intelligence.json data/bacon-history.json
            git commit -m 'Refresh Bacon public feed'
            git push
          fi

