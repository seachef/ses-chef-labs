name: Portfolio regression tests

on:
  push:
    paths:
      - 'preview/portfolio/**'
      - 'index.html'
      - 'scripts/retired-dashboard.test.cjs'
  pull_request:
    paths:
      - 'preview/portfolio/**'
      - 'index.html'
      - 'scripts/retired-dashboard.test.cjs'

permissions:
  contents: read

jobs:
  portfolio-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run portfolio regression tests
        working-directory: preview/portfolio
        run: node --test scripts/*.test.mjs
      - name: Check retired dashboard routing
        run: node --test scripts/retired-dashboard.test.cjs
      - name: Validate checked-in news data
        working-directory: preview/portfolio
        run: node scripts/validate-news-data.mjs
      - name: Validate checked-in launch research
        working-directory: preview/portfolio
        run: node scripts/validate-launch-research.mjs
