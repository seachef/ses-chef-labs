name: NEPTUNE 2 simple page tests
on:
  push:
    paths: ['preview/neptune-2/**', 'preview/research-desk/**', 'preview/portfolio/portfolio/auth-*.mjs', '.github/workflows/neptune2-tests.yml']
  pull_request:
    paths: ['preview/neptune-2/**', 'preview/research-desk/**', 'preview/portfolio/portfolio/auth-*.mjs', '.github/workflows/neptune2-tests.yml']
permissions:
  contents: read
jobs:
  simple-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test preview/neptune-2/*.test.mjs
      - run: node --check preview/neptune-2/app.mjs && node --check preview/neptune-2/model.mjs
