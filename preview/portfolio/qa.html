<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sea Chef Labs · Responsive QA</title><style>body{margin:0;background:#020f17;color:white;font:14px system-ui}header{position:sticky;top:0;z-index:1;padding:12px 16px;display:flex;gap:16px;align-items:center;background:#0b2938;min-width:440px}label{display:flex;align-items:center;gap:7px}select,button,a{font:inherit;padding:8px;background:#153c4e;color:white;border:1px solid #487286;border-radius:7px}main{padding:16px;min-width:440px}iframe{display:block;border:1px solid #547b8d;background:#041b27}p{margin:0;color:#b4cfe6}a{margin-left:auto;text-decoration:none}</style></head><body><header><label>Viewport<select id="viewport"><option value="1487,1058">Desktop · 1487 × 1058</option><option value="440,956">Phone · 440 × 956</option><option value="375,812">Phone · 375 × 812</option><option value="320,720">Compact · 320 × 720</option></select></label><button id="fullHeight">Full page height</button><button id="reload">Reload frame</button><a href="index.html">Open preview</a></header><main><p id="metrics" aria-live="polite">Waiting for frame load…</p><iframe id="previewFrame" title="Portfolio responsive preview" src="index.html" width="1487" height="1058"></iframe><p>Test frame only. The app inside uses its own viewport and responsive styles.</p></main><script>const frame=document.getElementById('previewFrame');frame.addEventListener('load',()=>{try{const p=frame.contentWindow.performance,n=p.getEntriesByType('navigation')[0],paint=p.getEntriesByType('paint'),resources=p.getEntriesByType('resource');const result={viewport:[frame.width,frame.height],domContentLoadedMs:Math.round(n.domContentLoadedEventEnd),loadMs:Math.round(n.loadEventEnd),firstContentfulPaintMs:paint.some(x=>x.name==='first-contentful-paint')?Math.round(paint.find(x=>x.name==='first-contentful-paint').startTime):null,resourceCount:resources.length,transferBytes:resources.reduce((s,x)=>s+x.transferSize,0),externalRequests:resources.filter(x=>new URL(x.name).origin!==location.origin).length};document.getElementById('metrics').textContent=JSON.stringify(result);}catch{document.getElementById('metrics').textContent='Timing unavailable';}});document.getElementById('viewport').addEventListener('change',e=>{const[w,h]=e.target.value.split(',');frame.width=w;frame.height=h;document.getElementById('metrics').textContent='Viewport '+w+' × '+h+' · reload to measure this size'});document.getElementById('fullHeight').addEventListener('click',()=>{frame.height=frame.contentDocument.documentElement.scrollHeight;});document.getElementById('reload').addEventListener('click',()=>{frame.src='index.html'});</script></body></html>
